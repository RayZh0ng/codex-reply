<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfbfd"/>
      <stop offset="0.58" stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#eef0f5"/>
    </linearGradient>
    <radialGradient id="orb" cx="32%" cy="24%" r="82%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.13" stop-color="#aee7ff"/>
      <stop offset="0.35" stop-color="#3b82f6"/>
      <stop offset="0.58" stop-color="#6d5dfc"/>
      <stop offset="0.78" stop-color="#d45cff"/>
      <stop offset="1" stop-color="#ff8b74"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="darkGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#212126" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#060609" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#147ce5"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff6b8a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#2f3b57" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0b1020" flood-opacity="0.14"/>
    </filter>
    <filter id="blur">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="orbShadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#5b50df" flood-opacity="0.35"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="882" y="84" width="608" height="732" rx="76"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- subtle editorial grid -->
  <g opacity="0.18" stroke="#afb4bf" stroke-width="1">
    <path d="M90 92H760"/>
    <path d="M90 808H760"/>
    <path d="M90 92V808"/>
  </g>

  <!-- left editorial typography -->
  <g font-family="SF Pro Display, SF Pro Text, Helvetica Neue, PingFang SC, Arial, sans-serif">
    <text x="112" y="142" fill="#6e6e73" font-size="22" font-weight="600" letter-spacing="4">ENGINEERING PLAYBOOK · 2026</text>

    <text x="102" y="302" fill="#1d1d1f" font-size="118" font-weight="700" letter-spacing="-6">VIBE</text>
    <text x="102" y="414" fill="#1d1d1f" font-size="118" font-weight="700" letter-spacing="-6">CODING</text>

    <rect x="108" y="468" width="530" height="8" rx="4" fill="url(#line)"/>

    <text x="108" y="548" fill="#1d1d1f" font-size="38" font-weight="600" letter-spacing="-1">从提示词到可信交付</text>
    <text x="108" y="601" fill="#6e6e73" font-size="26" font-weight="400">让 Agent 真正进入编码生产</text>

    <g transform="translate(108 684)">
      <rect width="168" height="52" rx="26" fill="#ffffff" stroke="#d8d8dc"/>
      <text x="84" y="34" text-anchor="middle" fill="#1d1d1f" font-size="18" font-weight="600">PROMPT</text>
      <rect x="184" width="176" height="52" rx="26" fill="#ffffff" stroke="#d8d8dc"/>
      <text x="272" y="34" text-anchor="middle" fill="#1d1d1f" font-size="18" font-weight="600">CONTEXT</text>
      <rect x="376" width="162" height="52" rx="26" fill="#1d1d1f"/>
      <text x="457" y="34" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600">VERIFY</text>
    </g>

    <text x="108" y="790" fill="#86868b" font-size="18" font-weight="500" letter-spacing="1.6">HUMAN INTENT × AGENT EXECUTION</text>
  </g>

  <!-- right hero card -->
  <g filter="url(#shadow)">
    <rect x="882" y="84" width="608" height="732" rx="76" fill="url(#glass)" stroke="#ffffff" stroke-width="2"/>
  </g>

  <g clip-path="url(#cardClip)">
    <circle cx="1448" cy="134" r="220" fill="#8bd7ff" opacity="0.55" filter="url(#blur)"/>
    <circle cx="923" cy="760" r="230" fill="#ff89c8" opacity="0.30" filter="url(#blur)"/>
    <circle cx="1310" cy="730" r="190" fill="#8a7cff" opacity="0.27" filter="url(#blur)"/>

    <!-- floating terminal -->
    <g filter="url(#softShadow)">
      <rect x="950" y="165" width="474" height="228" rx="36" fill="url(#darkGlass)"/>
      <circle cx="996" cy="207" r="8" fill="#ff605c"/>
      <circle cx="1023" cy="207" r="8" fill="#ffbd44"/>
      <circle cx="1050" cy="207" r="8" fill="#00ca4e"/>
      <text x="994" y="271" fill="#f5f5f7" font-family="SFMono-Regular, Menlo, monospace" font-size="23" font-weight="500">goal → context → code</text>
      <text x="994" y="316" fill="#8bd7ff" font-family="SFMono-Regular, Menlo, monospace" font-size="23">$ agent run --verify</text>
      <rect x="994" y="347" width="244" height="7" rx="3.5" fill="#34343a"/>
      <rect x="994" y="347" width="188" height="7" rx="3.5" fill="url(#line)"/>
    </g>

    <!-- luminous orb -->
    <g filter="url(#orbShadow)">
      <circle cx="1186" cy="544" r="151" fill="url(#orb)"/>
      <ellipse cx="1148" cy="492" rx="64" ry="38" fill="#ffffff" opacity="0.34" transform="rotate(-27 1148 492)"/>
      <path d="M1052 542c51 11 86 51 134 58 54 8 91-22 137-16" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" opacity="0.36"/>
    </g>

    <!-- glass status cards -->
    <g filter="url(#softShadow)" font-family="SF Pro Text, Helvetica Neue, PingFang SC, sans-serif">
      <rect x="930" y="622" width="252" height="116" rx="30" fill="#ffffff" fill-opacity="0.70" stroke="#ffffff"/>
      <circle cx="973" cy="665" r="14" fill="#30d158"/>
      <text x="1001" y="672" fill="#1d1d1f" font-size="21" font-weight="650">Tests passed</text>
      <text x="957" y="713" fill="#6e6e73" font-size="17">Evidence, not vibes.</text>

      <rect x="1200" y="650" width="248" height="104" rx="30" fill="#ffffff" fill-opacity="0.72" stroke="#ffffff"/>
      <text x="1232" y="691" fill="#6e6e73" font-size="16" font-weight="600" letter-spacing="1.2">AGENT LOOP</text>
      <text x="1232" y="724" fill="#1d1d1f" font-size="20" font-weight="650">Explore · Build · Verify</text>
    </g>
  </g>

  <!-- fine border -->
  <rect x="1" y="1" width="1598" height="898" rx="2" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
</svg>
