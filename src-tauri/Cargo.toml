[package]
name = "codex-relay"
version = "0.2.0-beta.10"
description = "A local Codex multi-account and collaboration desktop application"
authors = ["Codex Relay Contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codex_relay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.7", features = ["json"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.23"
chrono = "0.4"
futures-util = "0.3"
if-addrs = "0.15"
ipnet = "2"
rand = "0.8"
rcgen = { version = "0.13", features = ["x509-parser"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "system-proxy", "socks"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
toml_edit = "0.25"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
feishu-sdk = { version = "0.1.2", features = ["websocket"] }
tokio-tungstenite = "0.28"
aes = "0.8"
cbc = "0.1"
sha1 = "0.10"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]

[profile.release]
opt-level = "s"
lto = "thin"
panic = "abort"
strip = "symbols"
