name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release channel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.channel.outputs.version }}
      channel: ${{ steps.channel.outputs.channel }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
      manifest_name: ${{ steps.channel.outputs.manifest_name }}
    steps:
      - uses: actions/checkout@v4
      - id: channel
        name: Validate tag and select channel
        run: node scripts/resolve-release-channel.mjs "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            args: ""
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Codex Relay ${{ github.ref_name }}
          releaseBody: |
            Codex Relay ${{ github.ref_name }}

            Channel: ${{ needs.prepare.outputs.channel }}
          releaseDraft: false
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          args: ${{ matrix.args }}

  publish-manifest:
    name: Publish updater manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download generated latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p manifest
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern latest.json --dir manifest --clobber
          test -s manifest/latest.json

      - name: Upload fixed channel manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST_NAME: ${{ needs.prepare.outputs.manifest_name }}
        run: |
          cp manifest/latest.json "${MANIFEST_NAME}"
          if ! gh release view updater --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create updater --repo "${GITHUB_REPOSITORY}" --title "Updater manifests" --notes "Stable and beta update manifests for Codex Relay." --prerelease
          fi
          gh release upload updater "${MANIFEST_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber
